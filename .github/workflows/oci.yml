name: Crear infraestructura OCI con Terraform

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Crear los recursos despues de revisar el plan"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Terraform
        shell: bash
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_region: ${{ secrets.OCI_REGION }}
      TF_VAR_ssh_public_key: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
      TF_VAR_availability_domain: ${{ vars.OCI_AVAILABILITY_DOMAIN }}

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar clave API de OCI
        env:
          OCI_KEY_FILE: ${{ secrets.OCI_KEY_FILE }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.oci"
          chmod 700 "$HOME/.oci"
          printf '%s\n' "$OCI_KEY_FILE" > "$HOME/.oci/key.pem"
          chmod 600 "$HOME/.oci/key.pem"
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s\n' \
            "$OCI_USER_OCID" "$OCI_FINGERPRINT" "$OCI_TENANCY_OCID" "$OCI_REGION" \
            "$HOME/.oci/key.pem" > "$HOME/.oci/config"
          chmod 600 "$HOME/.oci/config"

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"

      - name: Revisar formato
        run: terraform fmt -check

      - name: Inicializar estado remoto
        run: terraform init -input=false

      - name: Validar configuracion
        run: terraform validate

      - name: Crear plan
        run: terraform plan -input=false -out=tfplan

      - name: Aplicar plan
        if: ${{ inputs.aplicar }}
        run: terraform apply -input=false -auto-approve tfplan

